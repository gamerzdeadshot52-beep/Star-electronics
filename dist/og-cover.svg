<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Star Electronics Ganga — Mobiles, Electronics, Furniture">
  <defs>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD980"/>
      <stop offset="0.5" stop-color="#F5B301"/>
      <stop offset="1" stop-color="#D99A00"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#1D6FFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D6FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#F5B301" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F5B301" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#04060E"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- logo mark -->
  <rect x="72" y="72" width="96" height="96" rx="24" fill="url(#star)"/>
  <path d="M120 92l8.6 18.7 20.4 2.5-14.7 14.2 3.7 20.3L120 137.9l-18 9.8 3.7-20.3-14.7-14.2 20.4-2.5L120 92Z" fill="#04060E"/>

  <text x="196" y="118" font-family="Poppins, Inter, Arial, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Star <tspan fill="#F5B301">Electronics</tspan></text>
  <text x="198" y="152" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="6" fill="#FFFFFF" fill-opacity="0.6">GANGA • HARYANA</text>

  <text x="72" y="300" font-family="Poppins, Inter, Arial, sans-serif" font-size="70" font-weight="700" fill="#FFFFFF">Mobiles. Electronics. Furniture.</text>
  <text x="72" y="384" font-family="Poppins, Inter, Arial, sans-serif" font-size="70" font-weight="700" fill="url(#star)">All brands, one store.</text>

  <rect x="72" y="430" width="470" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <text x="307" y="467" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">All Brands Available ✨🛒</text>

  <text x="72" y="556" font-family="Inter, Arial, sans-serif" font-size="26" fill="#FFFFFF" fill-opacity="0.7">Sangaria–Sirsa Road, Ganga, Haryana 125103</text>
  <text x="1128" y="556" text-anchor="end" font-family="Poppins, Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#F5B301">7357393293</text>
</svg>
